name: Apply requested guide revisions

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply requested content and layout revisions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old!r}")
              write(path, text.replace(old, new, 1))

          # Document date: keep the requested wording exactly as display text.
          replace_once(
              "guide.qmd",
              'date: "2026-08-26"\ndate-format: "D MMMM YYYY"\n',
              'date: "30th of August 2026"\n',
          )

          # Remove the opening live-availability disclaimer and the booking-urgency callout.
          replace_once(
              "content/01.qmd",
              "**Prices and operating details verified; live pitch availability not confirmed: 26 August 2026**\n\n",
              "",
          )
          replace_once(
              "content/01.qmd",
              "> **Booking urgency:** arrival is only about a week away and several attractive lakefront sites are still in their final high-season band. Contact the top choices **now**, preferably by phone or WhatsApp rather than relying only on email or an online calendar. Ask about both the camper pitch and two SUPs for the same morning.\n\n",
              "",
          )

          # Remove the retrospective shortlist section. Its substantive price/minimum-stay/live-availability
          # points are already stated in Best fit, the comparison table and Booking vs walk-in.
          replace_once(
              "content/01.qmd",
              "\n### What this changes for your shortlist\n",
              "",
          )
          p = Path("content/02.qmd")
          text = p.read_text(encoding="utf-8")
          marker = "---\n\n## Booking vs walk-in: what to expect"
          if marker not in text:
              raise SystemExit("Could not find the end of the shortlist-change section in content/02.qmd")
          p.write_text(text[text.index(marker):], encoding="utf-8")

          # Remove the final ranking-by-traveller-type section, which is redundant with earlier rankings.
          p = Path("content/07.qmd")
          text = p.read_text(encoding="utf-8")
          marker = "\n\n---\n\n# Final ranking by traveller type"
          if marker not in text:
              raise SystemExit("Could not find final ranking section in content/07.qmd")
          p.write_text(text[:text.index(marker)].rstrip() + "\n", encoding="utf-8")

          # content/08 begins with the continuation of that ranking; drop it through the ACSI section.
          p = Path("content/08.qmd")
          text = p.read_text(encoding="utf-8")
          acsi = "---\n\n# ACSI: what the discount actually means"
          if acsi not in text:
              raise SystemExit("Could not find ACSI section in content/08.qmd")
          text = text[text.index(acsi):]

          # Remove the generic campsite booking-question checklist.
          start = "\n\n---\n\n# Booking questions worth asking every campsite"
          end = "\n\n---\n\n# Useful websites, directories, booking tools and forums"
          if start not in text or end not in text:
              raise SystemExit("Could not find booking-questions section boundaries in content/08.qmd")
          s = text.index(start)
          e = text.index(end, s)
          text = text[:s] + text[e:]
          p.write_text(text, encoding="utf-8")

          # Capitalisation on the title page and globally more generous heading spacing in PDF.
          replace_once(
              "_extensions/iseo-guide/typst-template.typ",
              "[Camper van · lakefront camping · SUP rental]",
              "[Camper Van · Lakefront Camping · SUP Rental]",
          )
          replace_once(
              "_extensions/iseo-guide/typst-template.typ",
              "      above: 0.2em,\n      below: 0.75em,",
              "      above: 0.5em,\n      below: 1.15em,",
          )
          replace_once(
              "_extensions/iseo-guide/typst-template.typ",
              "    above: 1.1em,\n    below: 0.45em,",
              "    above: 2.4em,\n    below: 1.05em,",
          )
          replace_once(
              "_extensions/iseo-guide/typst-template.typ",
              "    above: 0.8em,\n    below: 0.3em,",
              "    above: 1.6em,\n    below: 0.9em,",
          )

          # Mirror the spacing hierarchy in the HTML edition.
          replace_once(
              "styles.scss",
              "h1 {\n  margin-top: 3rem;\n  padding-top: .5rem;\n  border-top: 5px solid var(--iseo-lake);\n  letter-spacing: -.025em;\n}\n\nh2 {\n  color: var(--iseo-lake);\n  margin-top: 2.2rem;\n}\n\nh3 {\n  color: var(--iseo-deep);\n}\n",
              "h1 {\n  margin-top: 4.4rem;\n  margin-bottom: 1.8rem;\n  padding-top: .5rem;\n  border-top: 5px solid var(--iseo-lake);\n  letter-spacing: -.025em;\n}\n\nh2 {\n  color: var(--iseo-lake);\n  margin-top: 4.6rem;\n  margin-bottom: 1.55rem;\n}\n\nh3 {\n  color: var(--iseo-deep);\n  margin-top: 2.8rem;\n  margin-bottom: 1.15rem;\n}\n",
          )

          # Keep edited Markdown files to one conventional trailing newline.
          for path in ["content/01.qmd", "content/02.qmd", "content/07.qmd", "content/08.qmd"]:
              write(path, read(path).rstrip() + "\n")
          PY

      - name: Commit revisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.qmd content/01.qmd content/02.qmd content/07.qmd content/08.qmd styles.scss _extensions/iseo-guide/typst-template.typ
          git diff --cached --check
          git commit -m "Revise guide content and heading spacing"
          git push origin HEAD:main
