name: Fix canonical campsite order

on:
  push:
    branches: [main]
    paths: [.canonical-order-trigger]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder campsite listings by their own labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ORDERED = [
              "Pilzone", "Cave", "Riva di San Pietro", "Quai", "Eurovil",
              "del Sole", "Eden", "Punta d’Oro", "Covelo", "Camping Iseo",
              "Sassabanek", "Olivella", "Belvedere Clusane",
          ]
          ORDER = {x: i for i, x in enumerate(ORDERED)}

          def read(path): return Path(path).read_text(encoding="utf-8")
          def write(path, text): Path(path).write_text(text.rstrip()+"\n", encoding="utf-8")

          def camp(label):
              x = re.sub(r"[*_`]", "", label).strip()
              # Distinctive names first; this avoids e.g. "Olivella (Pilzone)"
              # being mistaken for Pilzone.
              tests = [
                  ("Olivella", "olivella"),
                  ("Belvedere Clusane", "belvedere"),
                  ("Riva di San Pietro", "san pietro"),
                  ("del Sole", "del sole"),
                  ("Punta d’Oro", "punta d’oro"),
                  ("Punta d’Oro", "punta d'oro"),
                  ("Camping Iseo", "camping iseo"),
                  ("Sassabanek", "sassabanek"),
                  ("Eurovil", "eurovil"),
                  ("Covelo", "covelo"),
                  ("Quai", "quai"),
                  ("Cave", "cave"),
                  ("Eden", "eden"),
                  ("Pilzone", "pilzone"),
              ]
              low = x.lower()
              for canonical, needle in tests:
                  if needle in low:
                      return canonical
              raise ValueError(label)

          def k(label): return ORDER[camp(label)]

          # content/01: numbered best-fit list and price table.
          p = read("content/01.qmd")
          s = p.index("### Best fit for this trip")
          a = p.index("\n1. ", s) + 1
          b = p.index("\n\n**Belvedere Clusane**", a)
          items = p[a:b].splitlines()
          def numbered_label(line):
              m = re.match(r"^\d+\. \*\*(.+?)\*\*", line)
              if not m: raise ValueError(line)
              return m.group(1)
          items.sort(key=lambda x: k(numbered_label(x)))
          items = [re.sub(r"^\d+\.", f"{i}.", x, 1) for i, x in enumerate(items, 1)]
          p = p[:a] + "\n".join(items) + p[b:]

          h = "| Campsite | Availability for arrival 2 Sep | Approx. price for 2 adults + camper on 2 Sep | What the current booking information means |"
          s = p.index(h); a = p.index("\n| **", s)+1; b = p.index("\n\n**Belvedere Clusane", a)
          rows = p[a:b].splitlines()
          def first_cell(row): return row.split("|")[1].strip()
          rows.sort(key=lambda x: k(first_cell(x)))
          p = p[:a] + "\n".join(rows) + p[b:]
          write("content/01.qmd", p)

          # content/02..06: quick recommendations and all profile blocks.
          paths = [f"content/{i:02d}.qmd" for i in range(2,7)]
          combined = "\n".join(read(x).rstrip() for x in paths)+"\n"
          qh = "| Best for | Campsite | Why |"
          s = combined.index(qh); a = combined.index("\n| **", s)+1; b = combined.index("\n\n# Campsite profiles", a)
          qrows = combined[a:b].splitlines()
          def second_cell(row): return row.split("|")[2].strip()
          qrows.sort(key=lambda x: k(second_cell(x)))
          combined = combined[:a] + "\n".join(qrows) + combined[b:]

          ph = combined.index("# Campsite profiles")
          m = re.search(r"(?m)^## \d+\. ", combined[ph:]); first = ph+m.start()
          marker = "\n---\n\n# SUP planning on Lake Iseo"; tail_at = combined.index(marker, first)
          intro = combined[ph:first]
          blocks = re.split(r"\n\n---\n\n(?=## \d+\. )", combined[first:tail_at].strip())
          def heading_label(block):
              line = block.splitlines()[0]
              m = re.match(r"^## \d+\. (.+?)(?: —|$)", line)
              if not m: raise ValueError(line)
              return m.group(1)
          blocks.sort(key=lambda x: k(heading_label(x)))
          blocks = [re.sub(r"^## \d+\.", f"## {i}.", x, 1) for i,x in enumerate(blocks,1)]
          prefix = combined[:ph]; tail = combined[tail_at+len("\n---\n\n"):]
          groups = [blocks[:2], blocks[2:5], blocks[5:8], blocks[8:11], blocks[11:]]
          outs = [
              prefix+intro+"\n\n---\n\n".join(groups[0]),
              "\n\n---\n\n".join(groups[1]),
              "\n\n---\n\n".join(groups[2]),
              "\n\n---\n\n".join(groups[3]),
              "\n\n---\n\n".join(groups[4])+"\n\n---\n\n"+tail,
          ]
          for path,text in zip(paths,outs): write(path,text)

          # content/09: official campsite table.
          p = read("content/09.qmd")
          h = "| Campsite | Official website | Best reason to consider it for this trip |"
          s = p.index(h); a = p.index("\n| **",s)+1; b = p.index("\n\n# Deliberate exclusions",a)
          rows = p[a:b].splitlines(); rows.sort(key=lambda x:k(first_cell(x)))
          p = p[:a]+"\n".join(rows)+p[b:]

          # In the SUP-links table, keep non-campsite operators first, then campsite-specific
          # rows in the same canonical order.
          h = "| Operator / resource | Location / relevance | Link |"
          s = p.index(h); a = p.index("\n| **",s)+1; b = p.index("\n\n# Official campsite websites",a)
          rows = p[a:b].splitlines(); campsite_rows=[]; other=[]
          for row in rows:
              try: campsite_rows.append((k(first_cell(row)),row))
              except ValueError: other.append(row)
          campsite_rows.sort(key=lambda x:x[0])
          p = p[:a]+"\n".join(other+[x[1] for x in campsite_rows])+p[b:]
          write("content/09.qmd",p)

          # Guard assertions: the principal complete listings must now all agree.
          expected12 = ORDERED[:-1]
          p1 = read("content/01.qmd")
          s=p1.index("### Best fit for this trip"); a=p1.index("\n1. ",s)+1; b=p1.index("\n\n**Belvedere Clusane**",a)
          got=[camp(numbered_label(x)) for x in p1[a:b].splitlines()]
          if got != expected12: raise SystemExit(f"Best-fit order wrong: {got}")

          allp="\n".join(read(x) for x in paths)
          got=[camp(x) for x in re.findall(r"(?m)^## \d+\. (.+?)(?: —|$)",allp)]
          if got != ORDERED: raise SystemExit(f"Profile order wrong: {got}")
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/*.qmd
          git diff --cached --check
          git commit -m "Correct canonical campsite ordering"
          git push origin HEAD:main
