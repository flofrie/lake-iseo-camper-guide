name: Build travel guide

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Render HTML
        run: quarto render guide.qmd --to html

      - name: Render PDF with Typst
        run: quarto render guide.qmd --to iseo-guide-typst

      - name: Collect retained Typst source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _output
          typ_source="$(find . -type f -name '*.typ' \
            ! -path './_extensions/*' \
            ! -path './_output/*' \
            | head -n 1 || true)"
          if [[ -n "$typ_source" ]]; then
            cp "$typ_source" _output/lake-iseo-camper-guide.typ
            echo "Collected retained Typst source from $typ_source"
          else
            echo "No generated Typst source found outside _extensions; continuing without it."
          fi

      - name: Verify outputs
        run: |
          test -s _output/index.html
          test -s _output/lake-iseo-camper-guide.pdf
          ls -lah _output

      - name: Upload HTML, PDF and retained Typst source
        uses: actions/upload-artifact@v4
        with:
          name: lake-iseo-guide
          path: _output/
          if-no-files-found: error
